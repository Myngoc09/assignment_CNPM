services:
  # ---------- 1. CƠ SỞ DỮ LIỆU ----------
  postgres:
    image: postgres:18
    container_name: brewlite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: brewlite
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: brewlite123
    ports:
      - "5433:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite -d brewlite"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- 2. BACKEND (NestJS) ----------
  # Lưu ý: mock-bank KHÔNG chạy trong Docker, chạy riêng trên máy (cổng 3002)
  backend:
    build: ./backend
    container_name: brewlite-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Ghi đè 2 biến này: trong Docker không dùng "localhost" nữa
      DATABASE_URL: postgresql://brewlite:brewlite123@postgres:5432/brewlite
      MOCK_BANK_URL: http://host.docker.internal:3004
    # Cho container gọi được ra máy thật (cần trên Linux, Docker Desktop đã có sẵn)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
  
  # 3. FRONTEND - Next.js
  frontend:
    build:
      context: ./frontend
    container_name: brewlite-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres18_data:

 
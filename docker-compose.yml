services:
  postgres:
    image: postgres:16
    container_name: brewlite-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: brewlite
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: brewlite123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: